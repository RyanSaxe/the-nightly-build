# The machine contract for an enforced two-position article. Exactly two
# flexible sections means a one-sided article blocks; per-section citations
# require evidence in the orientation and both positions. Their internal
# structure remains open.
about: "Two evidence-backed positions on one genuinely contested question, presented without a house verdict."
class: longread
bands:
  words: [1200, 3500]
  flex_sections: [2, 2] # exactly two sides, rendered left vs right
sections: [orientation, sources]
cite_rule: per-section
chrome:
  - '<body class="nb-article">'
  - '<div class="nb-divide">'
  - "<h2>Sources</h2>"
