  <pre><code data-language="python">def nucleus(tokens, probabilities, threshold):
    ranked = sorted(zip(tokens, probabilities), key=lambda pair: -pair[1])
    kept, mass = [], 0.0
    for token, probability in ranked:
        kept.append(token)
        mass += probability
        if mass >= threshold:
            break
    return kept</code></pre>
