# A press-owned experiment in two-position reporting. The contract enforces
# orientation, two sourced positions, and sources without prescribing the
# internal argument or a concluding taxonomy.
about: "Two well-supported positions on one live public question, without a house verdict."
class: longread
bands:
  words: [1200, 3500]
  flex_sections: [2, 2]
sections: [orientation, sources]
cite_rule: per-section
chrome:
  - '<body class="nb-article">'
  - '<div class="rs-debate">'
  - "<h2>Sources</h2>"
