# A current-affairs desk for live public questions. The press-owned debate
# template is intentionally being dogfooded here before any engine template
# adopts it. Strict mode makes its structure and citation rules hard gates.
name: Policy Debate
mode: open
section: "Current Affairs"
template: debate
prompt: prompt.md
autopublish: true
strict: true
min_sources: 10
sources_by_kind:
  primary: [4, null]
  secondary: [3, null]
cadence: [tue, fri]
