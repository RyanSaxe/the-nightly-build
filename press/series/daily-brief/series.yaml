# The paper's quick read. Strict mode makes the word band a hard limit, and each
# item needs one citation, so the brief stays short and light on research.
name: Daily Brief
mode: rolling
section: Daily
template: brief
prompt: prompt.md
bands:
  items: [6, 6]
  words: [300, 700]
strict: true
min_sources: 6
cadence: daily
