# Niche, powerful tools for an expert workflow, rotating across Python packages,
# Neovim plugins, and AI-harness extensions, roughly one of each a week.
name: Expert Tools
mode: open
section: "Technical Practice"
template: article
prompt: prompt.md
strict: false
bands:
  words: [1200, 3000]
min_sources: 6
# Manual: never scheduled, accepts any requested slug. To resume the
# rotation, set cadence back to [mon, wed, fri].
cadence: manual
items:
  - slug: pydantic-monty
    title: "Pydantic Monty"
    consult:
      - https://github.com/pydantic/monty
      - https://pydantic.dev/articles/pydantic-monty
