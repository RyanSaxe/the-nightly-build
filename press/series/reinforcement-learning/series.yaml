# A daily open course. The curriculum outline in prompt.md sets the order, and the
# published lessons show how far it has come. The owner has chosen quality over cost for
# this series, so every role runs at the orchestrator's model and extra-high effort, and
# the voice guide is pinned so the course keeps one voice. The word band counts code and
# printed output, so it runs wider than the prose target in the template's identity. A lesson
# on a classic method can rest on a textbook and one paper, so the source floor stays low.
name: Reinforcement Learning
mode: open
section: "Courses"
template: lesson
prompt: prompt.md
strict: false
bands:
  words: [2500, 6000]
  flex_sections: [2, 5]
min_sources: 2
cadence: daily
voice_guide: voice-guide.md
production:
  required: true
  stages:
    researcher:
      model: inherit
      effort: xhigh
    writer:
      model: inherit
      effort: xhigh
    editor:
      model: inherit
      effort: xhigh
