# An opinion states its position before the argument, then answers the
# strongest opposing case. The cited argument has 2-5 flexible sections.
about: "An argued position stated up front, supported in cited sections, with the strongest opposing case answered."
class: longread
bands:
  words: [900, 2500]
  flex_sections: [2, 5]
sections: [position, counter, sources]
cite_rule: per-section
chrome:
  - '<body class="nb-article">'
  - '<div class="nb-note">'
  - '<span class="nb-note-label">Position</span>'
  - "<h2>Sources</h2>"
